name: OpenWrt CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - ".ai/task.md"
      - ".ai/constraints.md"
      - ".config"
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: OpenWrt branch or ref
        required: false
        default: openwrt-25.12
      config_file:
        description: Repository-relative OpenWrt config file
        required: false
        default: .config
      build_target:
        description: make target to run
        required: false
        default: world
      jobs:
        description: Parallel jobs
        required: false
        default: "4"
      ccache_size:
        description: Max ccache size
        required: false
        default: 2G

permissions:
  contents: read

concurrency:
  group: openwrt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPENWRT_REF: ${{ inputs.openwrt_ref || 'openwrt-25.12' }}
      CONFIG_FILE: ${{ github.workspace }}/${{ inputs.config_file || '.config' }}
      BUILD_TARGET: ${{ inputs.build_target || 'world' }}
      JOBS: ${{ inputs.jobs || '4' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: ${{ inputs.ccache_size || '2G' }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve config state
        id: config_state
        shell: bash
        run: |
          if [ -f "$CONFIG_FILE" ]; then
            config_hash=$(sha256sum "$CONFIG_FILE" | awk '{print $1}')
          else
            config_hash=no-config
          fi
          echo "config_hash=$config_hash" >> "$GITHUB_OUTPUT"

      - name: Clone OpenWrt source
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --single-branch --branch "${OPENWRT_REF}" https://github.com/openwrt/openwrt.git openwrt-src

      - name: Resolve OpenWrt source state
        id: openwrt_state
        shell: bash
        run: |
          openwrt_sha=$(git -C openwrt-src rev-parse HEAD)
          echo "openwrt_sha=$openwrt_sha" >> "$GITHUB_OUTPUT"
          echo "openwrt_short_sha=${openwrt_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        id: cache_dl_restore
        uses: actions/cache/restore@v4
        with:
          path: openwrt-src/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.openwrt_state.outputs.openwrt_sha }}-${{ steps.config_state.outputs.config_hash }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.openwrt_state.outputs.openwrt_sha }}-
            openwrt-dl-${{ runner.os }}-${{ env.OPENWRT_REF }}-

      - name: Restore ccache
        id: cache_ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: openwrt-ccache-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.config_state.outputs.config_hash }}-${{ github.run_id }}
          restore-keys: |
            openwrt-ccache-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.config_state.outputs.config_hash }}-
            openwrt-ccache-${{ runner.os }}-${{ env.OPENWRT_REF }}-

      - name: Restore incremental build cache
        id: cache_build_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt-src/staging_dir
            openwrt-src/build_dir
          key: openwrt-build-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.openwrt_state.outputs.openwrt_sha }}-${{ steps.config_state.outputs.config_hash }}
          restore-keys: |
            openwrt-build-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.openwrt_state.outputs.openwrt_sha }}-
            openwrt-build-${{ runner.os }}-${{ env.OPENWRT_REF }}-

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            ccache \
            clang \
            flex \
            file \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            libtool-bin \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            squashfs-tools \
            subversion \
            swig \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev

      - name: Run build
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/Invoke-OpenWrtBuild.ps1" `
            -SourceDir "${{ github.workspace }}/openwrt-src" `
            -ConfigPath "${{ env.CONFIG_FILE }}" `
            -MakeTarget "${{ env.BUILD_TARGET }}" `
            -Jobs $env:JOBS

      - name: List firmware outputs
        shell: bash
        run: |
          find openwrt-src/bin/targets -type f | sort

      - name: Verify required packages in firmware manifest
        shell: pwsh
        run: |
          $requiredPackages = @(
            'dropbear',
            'irqbalance',
            'curl',
            'ca-bundle',
            'tcpdump-mini',
            'iperf3',
            'mtr-json',
            'bind-dig',
            'block-mount',
            'lsblk',
            'e2fsprogs',
            'kmod-fs-ext4',
            'smartmontools',
            'luci-app-sqm',
            'luci-app-nlbwmon',
            'luci-app-banip',
            'luci-proto-wireguard',
            'wireguard-tools'
          )
          & "${{ github.workspace }}/scripts/Assert-OpenWrtPackages.ps1" `
            -ManifestPath "${{ github.workspace }}/openwrt-src/bin/targets/x86/64/openwrt-x86-64-generic.manifest" `
            -ManifestPackages $requiredPackages

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OPENWRT_REF }}-${{ steps.openwrt_state.outputs.openwrt_short_sha }}-${{ steps.config_state.outputs.config_hash }}-${{ github.run_id }}
          path: |
            openwrt-src/bin/targets/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-diagnostics-${{ env.OPENWRT_REF }}-${{ steps.openwrt_state.outputs.openwrt_short_sha }}-${{ steps.config_state.outputs.config_hash }}-${{ github.run_id }}
          path: |
            openwrt-src/.config
            openwrt-src/bin/targets/**/*.manifest
            openwrt-src/bin/targets/**/config.buildinfo
            openwrt-src/bin/targets/**/feeds.buildinfo
            openwrt-src/bin/targets/**/version.buildinfo
          if-no-files-found: ignore
          retention-days: 14

      - name: Save download cache
        if: always() && !cancelled() && steps.cache_dl_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt-src/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.openwrt_state.outputs.openwrt_sha }}-${{ steps.config_state.outputs.config_hash }}

      - name: Save ccache
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: openwrt-ccache-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.config_state.outputs.config_hash }}-${{ github.run_id }}

      - name: Save incremental build cache
        if: success() && steps.cache_build_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt-src/staging_dir
            openwrt-src/build_dir
          key: openwrt-build-${{ runner.os }}-${{ env.OPENWRT_REF }}-${{ steps.openwrt_state.outputs.openwrt_sha }}-${{ steps.config_state.outputs.config_hash }}
